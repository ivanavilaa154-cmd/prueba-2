  - MKT-08
- id: MKT-20
  nombre: Frecuencia y fatiga creativa
  pregunta: ¿Estamos saturando a la audiencia con los mismos anuncios?
  definicion: Frecuencia (impresiones / alcance) por anuncio en 7 días y tendencia de CTR/CPA del anuncio vs su primera semana.
  formula: |
    frecuencia_7d = impresiones_7d / alcance_7d (dato de la API a nivel anuncio)
    fatiga = frecuencia_7d > 3 and ctr_7d < 0.7 × ctr_primera_semana
  cube: ads.frecuencia, ads.anuncios_fatigados
  unidad: ratio | cantidad
  direccion: menor_mejor
  agregacion: calculado
  grano_min: semana
  dimensiones:
  - plataforma
  - campana
  - anuncio
  filtros_base:
  - plataformas sociales
  parametros:
    umbral_frecuencia: 3
  requisitos:
    obligatorias:
    - fct_ads_diario.impresiones
    - fct_ads_diario.alcance
    - fct_ads_diario.frecuencia
    - fct_ads_diario.clics_enlace
    opcionales: []
  roles_minimos:
  - publicidad
  casos_borde:
  - ''
  alertas:
  - condicion: anuncio fatigado con gasto > 10% de su campaña
    severidad: media
  relacionados:
  - MKT-03
- id: MKT-21
  nombre: Peso del tráfico orgánico
  pregunta: ¿Cuánto del tráfico y la venta no depende de pagar publicidad?
  definicion: Sesiones y venta atribuida de canales no pagos (busqueda_organica, social_organico, directo, referral, email) / total.
  formula: |
    pct_sesiones_organicas = Σ sesiones where not es_pago / Σ sesiones
    pct_venta_no_paga = Σ venta atribuida canal no pago / Σ venta atribuida
  cube: web.pct_organico, ventas.pct_venta_no_paga
  unidad: porcentaje
  direccion: mayor_mejor
  agregacion: ratio
  grano_min: semana
  dimensiones:
  - canal_marketing
  filtros_base: []
  parametros: {}
  requisitos:
    obligatorias: []
    opcionales: []
    alternativas:
    - nombre: web
      obligatorias:
      - fct_web_diario.sesiones
      - fct_web_diario.canal_marketing
    - nombre: pedidos
      obligatorias:
      - fct_atribucion_pedido.canal_marketing
  roles_minimos:
  - analitica_web o ventas (con UTM)
  casos_borde:
  - ''
  alertas:
  - condicion: pct_venta_no_paga cae > 10 pp en el trimestre
    severidad: media
  relacionados:
  - MKT-10
  - MKT-14
- id: MKT-22
  nombre: Inversión en marketing sobre ventas
  pregunta: ¿Qué porcentaje de la venta reinvertimos en marketing?
  definicion: Inversión en marketing (ads + otros gastos de marketing de cuentas cuenta estándar 6.1.03 si incluir_otros) / venta neta.
  formula: mkt_pct_venta = (MKT-01.inversion + otros_gastos_mkt) / nullif(VEN-01.venta_neta, 0)
  cube: marketing.inversion_pct_venta
  unidad: porcentaje
  direccion: neutral (objetivo tenant)
  agregacion: ratio
  grano_min: mes
  dimensiones:
