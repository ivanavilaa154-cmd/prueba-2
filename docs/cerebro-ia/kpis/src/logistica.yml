area: logistica
prefijo: LOG
titulo: KPIs de Logística
intro: |
  Cubre preparación, despacho, entrega, calidad de entrega, costos, backlog y performance por transportista.
  **Base:** `fct_envio` (un envío por pedido o por bulto-grupo), `fct_evento_envio`, `fct_preparacion`.
  **Tiempos:** se miden en **horas hábiles** o **días hábiles** (`ref.fecha_tenant.es_habil` + horario operativo del tenant, default L-V 9-18)
  salvo que el KPI diga "corridos". Corte de despacho configurable (default 14:00: pedidos confirmados después del corte cuentan desde el día hábil siguiente).
  Envíos `modalidad = 'retiro_en_tienda'` y `es_devolucion = true` se excluyen salvo en KPIs específicos (LOG-18).
  Envíos con `es_controlable = false` (preparados y despachados por un tercero) se excluyen de LOG-02, LOG-03, LOG-15, LOG-16 (no controlables) y se reportan aparte en entrega.
kpis:
- id: LOG-01
  nombre: Envíos despachados
  pregunta: ¿Cuántos pedidos despachamos?
  definicion: Cantidad de envíos con despacho_at en el período.
  formula: select count(*) from core.fct_envio where not es_devolucion and local_date(despacho_at) between :desde and :hasta;
  cube: envios.despachados
  unidad: cantidad
  direccion: mayor_mejor
  agregacion: aditivo
  grano_min: dia
  dimensiones:
  - transportista
  - modalidad
  - deposito_origen
  - zona_destino
  - region_destino
  - canal
  filtros_base:
  - no devolución
  parametros: {}
  requisitos:
    obligatorias:
    - fct_envio.despacho_at
    - fct_envio.estado
    opcionales: []
  roles_minimos:
  - logistica
  casos_borde:
  - ''
  alertas: []
  relacionados:
  - LOG-14
- id: LOG-02
  nombre: Tiempo de preparación
  pregunta: ¿Cuánto tardamos desde que se confirma el pedido hasta que está listo para despachar?
  definicion: Mediana y P90 de horas hábiles entre pedido_at (ajustado al corte) y listo_despacho_at.
  formula: |
    select percentile_cont(0.5) within group (order by horas_habiles(pedido_at_ajustado, listo_despacho_at)),
           percentile_cont(0.9) within group (order by horas_habiles(pedido_at_ajustado, listo_despacho_at))
    from core.fct_envio where es_controlable and modalidad <> 'retiro_en_tienda'
      and listo_despacho_at is not null and local_date(listo_despacho_at) between :desde and :hasta;
  cube: envios.horas_preparacion_p50, envios.horas_preparacion_p90
  unidad: horas
  direccion: menor_mejor
  agregacion: percentil
  grano_min: dia
  dimensiones:
  - deposito_origen
  - canal
  - dia_semana
  - franja_horaria_pedido
  filtros_base:
  - excluye envíos no controlables
  parametros:
    corte_hora: '14:00'
    unidad: horas_habiles|horas_corridas
  requisitos:
    obligatorias:
    - fct_envio.pedido_at
    opcionales:
    - fct_preparacion.inicio_at
    - fct_preparacion.fin_at
    alternativas:
    - nombre: con_listo_despacho
      obligatorias:
      - fct_envio.listo_despacho_at
    - nombre: solo_despacho
      obligatorias:
      - fct_envio.despacho_at
  roles_minimos:
  - logistica
  - logistica o logistica
  casos_borde:
  - Si no hay listo_despacho_at se usa despacho_at (se informa "preparación + espera de colecta").
  alertas:
  - condicion: p90 > 24 horas hábiles
    severidad: media
  relacionados:
  - LOG-03
  - LOG-16
- id: LOG-03
  nombre: Despacho a tiempo
  pregunta: ¿Qué porcentaje de pedidos despachamos dentro del plazo comprometido?
  definicion: Envíos con despacho_at ≤ fecha_limite_despacho / envíos cuyo límite cayó en el período (incluye los aún no despachados con límite vencido como fuera
    de término).
  formula: |
    select count(*) filter (where despacho_at <= fecha_limite_despacho)::numeric / nullif(count(*),0)
    from core.fct_envio where es_controlable and modalidad <> 'retiro_en_tienda' and not es_devolucion
      and local_date(fecha_limite_despacho) between :desde and :hasta and estado <> 'cancelado';
  cube: envios.despacho_a_tiempo_pct
  unidad: porcentaje
  direccion: mayor_mejor
  agregacion: ratio
  grano_min: dia
  dimensiones:
  - deposito_origen
  - canal
  - modalidad
  filtros_base:
  - excluye envíos no controlables
  - excluye cancelados
  parametros:
    sla_horas: tenant (default 24 hábiles)
  requisitos:
    obligatorias:
    - fct_envio.despacho_at
    - fct_envio.fecha_limite_despacho
    - fct_envio.estado
    opcionales: []
  roles_minimos:
  - logistica
  casos_borde:
  - 'marketplace mide "despachos demorados" para reputación con su propio límite: usar estimated_handling_limit.'
  alertas:
  - condicion: despacho_a_tiempo < 95%
    severidad: alta
  - condicion: canal marketplace < 97% (riesgo reputación)
    severidad: alta
  relacionados:
  - LOG-02
  - LOG-14
- id: LOG-04
  nombre: Lead time total de entrega
  pregunta: ¿Cuántos días tarda el cliente en recibir su pedido desde que compra?
  definicion: Mediana y P90 de días hábiles entre pedido_at y entrega_at, envíos entregados en el período.
  formula: select percentile_cont(0.5) within group (order by dias_habiles(pedido_at, entrega_at)) from core.fct_envio where estado='entregado' and local_date(entrega_at)
    between :desde and :hasta;
  cube: envios.lead_time_p50, envios.lead_time_p90
  unidad: dias
  direccion: menor_mejor
  agregacion: percentil
  grano_min: dia
  dimensiones:
  - transportista
  - modalidad
  - zona_destino
  - region_destino
  - canal
  filtros_base:
  - entregados
  parametros:
    unidad: dias_habiles|dias_corridos
  requisitos:
    obligatorias:
    - fct_envio.pedido_at
    - fct_envio.entrega_at
    - fct_envio.estado
    opcionales:
    - fct_envio.zona_destino
  roles_minimos:
  - logistica
  casos_borde:
  - Sin entrega_at (flota propia sin registro) → KPI no disponible para ese transportista.
  alertas:
  - condicion: p50 de una zona sube > 1 día vs mes anterior
    severidad: media
  relacionados:
  - LOG-05
  - LOG-06
- id: LOG-05
  nombre: Tiempo de tránsito
  pregunta: ¿Cuánto tarda el transportista desde que retira hasta que entrega?
  definicion: Mediana y P90 de días hábiles entre despacho_at y entrega_at.
  formula: select percentile_cont(0.5) within group (order by dias_habiles(despacho_at, entrega_at)) from core.fct_envio where estado='entregado' and local_date(entrega_at)
    between :desde and :hasta;
  cube: envios.transito_p50, envios.transito_p90
  unidad: dias
  direccion: menor_mejor
  agregacion: percentil
  grano_min: dia
  dimensiones:
  - transportista
  - servicio
  - zona_destino
  - region_destino
  filtros_base:
  - entregados
  parametros: {}
  requisitos:
    obligatorias:
    - fct_envio.despacho_at
    - fct_envio.entrega_at
    - fct_envio.estado
    opcionales:
    - fct_envio.zona_destino
    - fct_evento_envio.evento_at
  roles_minimos:
  - logistica
  casos_borde:
  - ''
  alertas:
  - condicion: transportista con p90 > SLA contratado por zona
    severidad: media
  relacionados:
  - LOG-17
- id: LOG-06
  nombre: Entregas a tiempo (OTD)
  pregunta: ¿Qué porcentaje de pedidos llegó en la fecha prometida al cliente?
  definicion: Envíos entregados con local_date(entrega_at) ≤ fecha_promesa / envíos con fecha_promesa en el período (los no entregados con promesa vencida cuentan
    como tarde).
  formula: |
    select count(*) filter (where estado='entregado' and local_date(entrega_at) <= fecha_promesa)::numeric / nullif(count(*),0)
    from core.fct_envio where not es_devolucion and estado <> 'cancelado' and fecha_promesa between :desde and least(:hasta, current_date - 1);
  cube: envios.otd_pct
  unidad: porcentaje
  direccion: mayor_mejor
  agregacion: ratio
  grano_min: dia
  dimensiones:
  - transportista
  - modalidad
  - zona_destino
  - canal
  - deposito_origen
  filtros_base:
  - con fecha_promesa
  - excluye cancelados
  parametros: {}
  requisitos:
    obligatorias:
    - fct_envio.entrega_at
    - fct_envio.fecha_promesa
    - fct_envio.estado
    opcionales: []
  roles_minimos:
  - logistica
  casos_borde:
  - Cuando la promesa es un rango se usa el límite superior.
  alertas:
  - condicion: otd < 90%
    severidad: alta
  relacionados:
  - LOG-07
- id: LOG-07
  nombre: OTIF (a tiempo y completo)
  pregunta: ¿Qué porcentaje de pedidos llegó a tiempo, completo y sin error?
  definicion: Pedidos entregados a tiempo (LOG-06) con todas sus líneas completas (fill 100 %) y sin devolución por error_preparacion / danado_transporte / pedidos
    con promesa en el período.
  formula: |
    otif = count(pedidos where a_tiempo and completo and not reclamo_logistico) / count(pedidos con promesa en periodo)
    completo = Σ cantidad_entregada >= Σ cantidad (fct_pedido_linea)
    reclamo_logistico = exists fct_devolucion motivo in ('error_preparacion','danado_transporte','no_entregado')
  cube: envios.otif_pct
  unidad: porcentaje
  direccion: mayor_mejor
  agregacion: ratio
  grano_min: dia
  dimensiones:
  - canal
  - transportista
  - deposito_origen
  - cliente (B2B)
  filtros_base: []
  parametros: {}
  requisitos:
    obligatorias:
    - fct_envio.entrega_at
    - fct_envio.fecha_promesa
    - fct_envio.estado
    - fct_pedido_linea.cantidad
    - fct_pedido_linea.cantidad_entregada
    opcionales:
    - fct_devolucion.motivo
  roles_minimos:
  - logistica
  - ventas
  casos_borde:
  - ''
  alertas:
  - condicion: otif < 90%
    severidad: alta
  relacionados:
  - LOG-06
  - INV-08
- id: LOG-08
  nombre: Entrega en primer intento
  pregunta: ¿Qué porcentaje de envíos se entrega en la primera visita?
  definicion: Envíos entregados con cantidad_intentos = 1 / envíos entregados + fallidos del período.
  formula: select count(*) filter (where estado='entregado' and cantidad_intentos <= 1)::numeric / nullif(count(*) filter (where estado in ('entregado','devuelto_origen')),0)
    from core.fct_envio where local_date(coalesce(entrega_at, _actualizado_at)) between :desde and :hasta;
  cube: envios.primer_intento_pct
  unidad: porcentaje
  direccion: mayor_mejor
  agregacion: ratio
  grano_min: dia
  dimensiones:
  - transportista
  - zona_destino
  - region_destino
  filtros_base:
  - domicilio (excluye retiro en sucursal)
  parametros: {}
  requisitos:
    obligatorias:
    - fct_envio.estado
    opcionales: []
    alternativas:
    - nombre: intentos
      obligatorias:
      - fct_envio.cantidad_intentos
    - nombre: eventos
      obligatorias:
      - fct_evento_envio.evento_at
      - fct_evento_envio.estado
  roles_minimos:
  - logistica
  - logistica o logistica
  casos_borde:
  - ''
  alertas:
  - condicion: primer_intento < 85%
    severidad: media
  relacionados:
  - LOG-09
- id: LOG-09
  nombre: Envíos fallidos / devueltos a origen
  pregunta: ¿Qué porcentaje de envíos no llega al cliente?
  definicion: Envíos en estado devuelto_origen / envíos finalizados (entregado + devuelto_origen + extraviado) del período, con desglose de motivo.
  formula: select count(*) filter (where estado='devuelto_origen')::numeric / nullif(count(*) filter (where estado in ('entregado','devuelto_origen','extraviado_danado')),0)
    from core.fct_envio where local_date(_actualizado_at) between :desde and :hasta;
  cube: envios.fallidos_pct
  unidad: porcentaje
  direccion: menor_mejor
  agregacion: ratio
  grano_min: dia
  dimensiones:
  - transportista
  - motivo_no_entrega
  - zona_destino
  - canal
  filtros_base: []
  parametros: {}
  requisitos:
    obligatorias:
    - fct_envio.estado
    opcionales:
    - fct_envio.motivo_no_entrega
    - fct_envio.finalizado_at
    - fct_evento_envio.evento_at
  roles_minimos:
  - logistica
  casos_borde:
  - Usar fecha del evento final (fct_evento_envio) cuando exista, no _actualizado_at.
  alertas:
  - condicion: fallidos > 3%
    severidad: alta
  relacionados:
  - LOG-08
  - LOG-10
- id: LOG-10
  nombre: Envíos extraviados o siniestrados
  pregunta: ¿Cuántos envíos se pierden o llegan rotos?
  definicion: Envíos extraviado_danado + devoluciones por danado_transporte / envíos despachados; valor a costo de lo perdido.
  formula: |
    tasa = (count(envios extraviado_danado) + count(devoluciones motivo danado_transporte)) / count(despachados)
    valor = Σ costo_mercaderia de esos pedidos
  cube: envios.siniestros_pct, envios.valor_siniestros
  unidad: porcentaje | moneda
  direccion: menor_mejor
  agregacion: ratio / aditivo
  grano_min: mes
  dimensiones:
  - transportista
  - zona_destino
  filtros_base: []
  parametros: {}
  requisitos:
    obligatorias:
    - fct_envio.estado
    - fct_envio.despacho_at
    - fct_pedido_linea.costo_total
    opcionales:
    - fct_devolucion.motivo
  roles_minimos:
  - logistica
  - ventas
  casos_borde:
  - 'Siniestros reclamables al transportista: informar monto a reclamar si el tenant carga seguro/declarado.'
  alertas:
  - condicion: siniestros > 0.5%
    severidad: alta
  relacionados:
  - LOG-09
  - LOG-17
- id: LOG-11
  nombre: Costo de envío por pedido
  pregunta: ¿Cuánto nos cuesta en promedio enviar un pedido?
  definicion: Σ costo_envio / envíos despachados (también por kg).
  formula: select sum(costo_envio)/nullif(count(*),0), sum(costo_envio)/nullif(sum(coalesce(peso_volumetrico_kg, peso_kg)),0) from core.fct_envio where not es_devolucion
    and local_date(despacho_at) between :desde and :hasta;
  cube: envios.costo_por_envio, envios.costo_por_kg
  unidad: moneda
  direccion: menor_mejor
  agregacion: ratio
  grano_min: dia
  dimensiones:
  - transportista
  - zona_destino
  - modalidad
  - canal
  filtros_base:
  - no devolución
  parametros:
    ajuste: real por defecto
  requisitos:
    obligatorias:
    - fct_envio.costo_envio
    - fct_envio.despacho_at
    opcionales:
    - fct_envio.zona_destino
  roles_minimos:
  - logistica
  casos_borde:
  - Costos estimados por tarifa se marcan; al llegar la factura del transportista se reemplazan.
  alertas:
  - condicion: costo real por envío sube > 10% vs mes anterior
    severidad: media
  relacionados:
  - LOG-12
  - LOG-13
- id: LOG-12
  nombre: Costo logístico sobre venta
  pregunta: ¿Qué porcentaje de lo que vendemos se va en logística?
  definicion: (Σ costo_envio − Σ importe_envio_cobrado + costo de preparación opcional) / venta neta de los pedidos despachados.
  formula: |
    select (sum(e.costo_envio) - sum(coalesce(e.importe_envio_cobrado,0))) / nullif(sum(p.importe_neto),0)
    from core.fct_envio e join core.fct_pedido p using (pedido_id)
    where not e.es_devolucion and local_date(e.despacho_at) between :desde and :hasta;
  cube: envios.costo_logistico_pct
  unidad: porcentaje
  direccion: menor_mejor
  agregacion: ratio
  grano_min: dia
  dimensiones:
  - canal
  - transportista
  - zona_destino
  - categoria
  filtros_base: []
  parametros:
    neto_de_cobrado: true
    incluir_devoluciones: true
  requisitos:
    obligatorias:
    - fct_envio.costo_envio
    - fct_pedido.importe_neto
    opcionales:
    - fct_pedido.importe_envio_cobrado
  roles_minimos:
  - logistica
  - ventas
  casos_borde:
  - incluir_devoluciones suma el costo de envíos es_devolucion (logística inversa).
  alertas:
  - condicion: costo_logistico_pct > umbral tenant (default 8%)
    severidad: alta
  relacionados:
  - VEN-09
  - LOG-13
- id: LOG-13
  nombre: Subsidio de envío
  pregunta: ¿Cuánto ponemos de nuestro bolsillo en envíos gratis?
  definicion: Σ (costo_envio − importe_envio_cobrado) donde costo > cobrado; % de envíos con envío gratis.
  formula: select sum(greatest(costo_envio - coalesce(importe_envio_cobrado,0),0)), avg((coalesce(importe_envio_cobrado,0)=0)::int) from core.fct_envio where not
    es_devolucion and local_date(despacho_at) between :desde and :hasta;
  cube: envios.subsidio, envios.pct_envio_gratis
  unidad: moneda | porcentaje
  direccion: menor_mejor
  agregacion: aditivo / ratio
  grano_min: dia
  dimensiones:
  - canal
  - zona_destino
  - rango_ticket
  filtros_base: []
  parametros: {}
  requisitos:
    obligatorias:
    - fct_envio.costo_envio
    opcionales:
    - fct_pedido.importe_envio_cobrado
  roles_minimos:
  - logistica
  casos_borde:
  - ''
  alertas: []
  relacionados:
  - LOG-12
- id: LOG-14
  nombre: Backlog de despacho
  pregunta: ¿Cuántos pedidos están pendientes de despachar y cuántos están atrasados?
  definicion: Pedidos válidos confirmados sin despacho_at (estado pendiente/en_preparacion/listo_para_despachar) a la fecha; atrasados = fecha_limite_despacho < ahora;
    antigüedad en horas hábiles.
  formula: |
    select count(*) backlog, count(*) filter (where fecha_limite_despacho < now()) atrasados,
           max(horas_habiles(pedido_at, now())) antiguedad_max
    from core.fct_envio where despacho_at is null and estado in ('pendiente','en_preparacion','listo_para_despachar');
  cube: envios.backlog, envios.backlog_atrasado
  unidad: cantidad
  direccion: menor_mejor
  agregacion: snapshot
  grano_min: hora
  dimensiones:
  - deposito_origen
  - canal
  - modalidad
  filtros_base:
  - excluye envíos no controlables
  parametros: {}
  requisitos:
    obligatorias:
    - fct_envio.pedido_at
    - fct_envio.despacho_at
    - fct_envio.fecha_limite_despacho
    - fct_envio.estado
    - fct_pedido.estado
    - fct_pedido.fecha_confirmacion
    opcionales: []
  roles_minimos:
  - logistica
  - ventas
  casos_borde:
  - Pedidos confirmados sin envío creado se agregan desde fct_pedido (estado confirmado, sin envío) como backlog "sin preparar".
  alertas:
  - condicion: atrasados > 0 en marketplace
    severidad: critica
  - condicion: backlog > 1.5× promedio de despachos diarios
    severidad: alta
  relacionados:
  - LOG-03
  - VEN-17
- id: LOG-15
  nombre: Precisión de preparación (picking)
  pregunta: ¿Qué porcentaje de pedidos preparamos sin errores?
  definicion: 1 − (pedidos con error de preparación / pedidos preparados). Error = línea con error registrada en preparación o devolución motivo error_preparacion.
  formula: 1 - count(distinct pedido_id where lineas_con_error > 0 or devolucion.motivo = 'error_preparacion') / count(distinct pedidos preparados)
  cube: envios.precision_picking_pct
  unidad: porcentaje
  direccion: mayor_mejor
  agregacion: ratio
  grano_min: semana
  dimensiones:
  - deposito
  - operario
  - categoria
  filtros_base:
  - excluye envíos no controlables
  parametros: {}
  requisitos:
    obligatorias: []
    opcionales: []
    alternativas:
    - nombre: registro_preparacion
      obligatorias:
      - fct_preparacion.lineas_con_error
    - nombre: devoluciones
      obligatorias:
      - fct_devolucion.motivo
  roles_minimos:
  - logistica o ventas
  casos_borde:
  - ''
  alertas:
  - condicion: precision < 99%
    severidad: media
  relacionados:
  - VEN-16
- id: LOG-16
  nombre: Productividad de preparación
  pregunta: ¿Cuántas unidades/pedidos preparamos por hora de trabajo?
  definicion: Unidades (o líneas o pedidos) preparadas / horas de preparación registradas.
  formula: select sum(unidades) / nullif(sum(extract(epoch from fin_at - inicio_at))/3600,0) from core.fct_preparacion where local_date(fin_at) between :desde and
    :hasta;
  cube: preparacion.unidades_por_hora
  unidad: unidades/hora
  direccion: mayor_mejor
  agregacion: ratio
  grano_min: dia
  dimensiones:
  - deposito
  - operario
  - franja_horaria
  filtros_base: []
  parametros:
    medida: unidades|lineas|pedidos
  requisitos:
    obligatorias:
    - fct_preparacion.inicio_at
    - fct_preparacion.fin_at
