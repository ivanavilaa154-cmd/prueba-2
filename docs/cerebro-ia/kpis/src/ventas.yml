area: ventas
prefijo: VEN
titulo: KPIs de Ventas
intro: |
  Cubre volumen, crecimiento, rentabilidad comercial, clientes, devoluciones y pipeline B2B.
  **Base de venta:** por defecto los KPIs de ventas son **comerciales** (`fct_pedido`, fecha de pedido, filtro `pedido_valido`, docs/02 §7.3).
  El parámetro `base='facturada'` cambia a `fct_comprobante` circuito venta (equivale a FIN-01 modo gestión).
  Montos sin impuesto indirecto y sin envío cobrado, moneda base, con opción `ajuste='real'`.
  **Filtro `pedido_valido`** = `es_fuente_verdad and estado not in ('borrador','cancelado') and coalesce(estado_pago,'aprobado') not in ('rechazado','pendiente')`.
kpis:
- id: VEN-01
  nombre: Venta neta
  pregunta: ¿Cuánto vendimos?
  definicion: Suma de importe neto (sin impuesto indirecto, sin envío, después de descuentos) de pedidos válidos, menos devoluciones del período.
  formula: |
    select sum(p.importe_neto) - coalesce((select sum(d.importe_neto) from core.fct_devolucion d
            where d.estado in ('recibida','reintegrada') and d.fecha_recepcion between :desde and :hasta),0) as venta_neta
    from core.fct_pedido p where pedido_valido and p.fecha_pedido between :desde and :hasta;
  cube: ventas.venta_neta
  unidad: moneda
  direccion: mayor_mejor
  agregacion: aditivo
  grano_min: dia
  dimensiones:
  - canal
  - sucursal
  - vendedor
  - cliente
  - tipo_cliente
  - region
  - producto
  - categoria
  - marca
  - canal_marketing
  - medio_pago
  filtros_base:
  - pedido_valido
  parametros:
    base: comercial|facturada
    neto_devoluciones: true
    ajuste: nominal|real
    moneda: base|<ISO>
  requisitos:
    obligatorias:
    - fct_pedido.fecha_pedido
    - fct_pedido.estado
    - fct_pedido.es_fuente_verdad
    - fct_pedido.importe_neto
    opcionales:
    - fct_pedido.estado_pago
    - fct_pedido.canal_id
    - fct_pedido_linea.producto_id
    - fct_pedido_linea.importe_neto
    - fct_devolucion.fecha_recepcion
    - fct_devolucion.importe_neto
  roles_minimos:
  - ventas
  casos_borde:
  - Con dimensión producto/categoría se suma fct_pedido_linea.importe_neto (el descuento de cabecera ya viene prorrateado en líneas).
  - Pedidos de marketplace en pack cuentan como un pedido.
  - Pedidos en moneda extranjera → TC del día del pedido.
  alertas:
  - condicion: venta diaria < 60% del promedio del mismo día de semana de las últimas 4 semanas
    severidad: alta
  - condicion: venta del mes proyectada (VEN-24) < 90% presupuesto
    severidad: alta
  relacionados:
  - FIN-01
  - VEN-06
  - VEN-24
- id: VEN-02
  nombre: Cantidad de pedidos
  pregunta: ¿Cuántas ventas/pedidos hicimos?
  definicion: Conteo de pedidos válidos distintos.
  formula: select count(distinct pedido_id) from core.fct_pedido where pedido_valido and fecha_pedido between :desde and :hasta;
  cube: ventas.pedidos
  unidad: cantidad
  direccion: mayor_mejor
  agregacion: aditivo (distinct por grano)
  grano_min: dia
  dimensiones:
  - canal
  - sucursal
  - vendedor
  - region
  - canal_marketing
  - medio_pago
  filtros_base:
  - pedido_valido
  parametros: {}
  requisitos:
    obligatorias:
    - fct_pedido.fecha_pedido
    - fct_pedido.estado
    - fct_pedido.es_fuente_verdad
    opcionales:
    - fct_pedido.estado_pago
    - fct_pedido.canal_id
  roles_minimos:
  - ventas
  casos_borde:
  - Con dimensión producto se cuentan pedidos que contienen el producto (no aditivo entre productos).
  alertas:
  - condicion: pedidos del día = 0 en canal con histórico > 5/día
    severidad: critica
  relacionados:
  - VEN-03
- id: VEN-03
  nombre: Ticket promedio
  pregunta: ¿Cuánto gasta en promedio cada pedido?
  definicion: Venta neta de pedidos válidos / cantidad de pedidos válidos (sin descontar devoluciones).
  formula: select sum(importe_neto)/nullif(count(distinct pedido_id),0) from core.fct_pedido where pedido_valido and fecha_pedido between :desde and :hasta;
  cube: ventas.ticket_promedio
  unidad: moneda
  direccion: mayor_mejor
  agregacion: ratio
  grano_min: dia
  dimensiones:
  - canal
  - sucursal
  - vendedor
  - tipo_cliente
  - canal_marketing
  - es_primera_compra
  filtros_base:
  - pedido_valido
  parametros:
    ajuste: nominal|real
  requisitos:
    obligatorias:
    - fct_pedido.fecha_pedido
    - fct_pedido.estado
    - fct_pedido.es_fuente_verdad
    - fct_pedido.importe_neto
    opcionales:
    - fct_pedido.es_primera_compra
  roles_minimos:
  - ventas
  casos_borde:
  - Comparaciones interanuales siempre en términos reales por inflación.
  alertas:
  - condicion: ticket real cae > 10% vs promedio 3 meses
    severidad: media
  relacionados:
  - VEN-01
  - VEN-04
- id: VEN-04
  nombre: Unidades vendidas y unidades por pedido
  pregunta: ¿Cuántas unidades vendimos y cuántas lleva cada pedido?
  definicion: Suma de cantidad de líneas de pedidos válidos; UPT = unidades / pedidos.
  formula: |
    select sum(l.cantidad) unidades, sum(l.cantidad)/nullif(count(distinct l.pedido_id),0) upt
    from core.fct_pedido_linea l join core.fct_pedido p using (pedido_id)
    where pedido_valido and p.fecha_pedido between :desde and :hasta;
  cube: ventas.unidades, ventas.unidades_por_pedido
  unidad: unidades
  direccion: mayor_mejor
  agregacion: aditivo / ratio
  grano_min: dia
  dimensiones:
  - producto
  - categoria
  - marca
  - canal
  - sucursal
  filtros_base:
  - pedido_valido
  - excluye es_servicio
  parametros: {}
  requisitos:
    obligatorias:
    - fct_pedido_linea.producto_id
    - fct_pedido_linea.cantidad
    - fct_pedido.fecha_pedido
    - fct_pedido.estado
    - fct_pedido.es_fuente_verdad
    opcionales: []
  roles_minimos:
  - ventas
  casos_borde:
  - Productos vendidos por kg/metro no se suman con unidades; agrupar por unidad_medida.
  alertas: []
  relacionados:
  - INV-05
- id: VEN-05
  nombre: Mix y participación por canal
  pregunta: ¿Qué porcentaje de la venta viene de cada canal?
  definicion: Venta neta del canal / venta neta total.
  formula: select canal_id, sum(importe_neto) / sum(sum(importe_neto)) over () from core.fct_pedido where pedido_valido and fecha_pedido between :desde and :hasta
    group by 1;
  cube: ventas.venta_neta (share calculado en MCP con `comparar='share'`)
  unidad: porcentaje
  direccion: neutral
  agregacion: ratio
  grano_min: dia
  dimensiones:
  - canal
  - sucursal
  - categoria
  - canal_marketing
  filtros_base:
  - pedido_valido
  parametros:
    dimension_share: canal
  requisitos:
    obligatorias:
    - fct_pedido.fecha_pedido
    - fct_pedido.importe_neto
    - fct_pedido.canal_id
    opcionales: []
  roles_minimos:
  - ventas
  casos_borde:
  - ''
  alertas:
  - condicion: un canal concentra > 70% de la venta (riesgo de dependencia)
    severidad: media
  relacionados:
  - VEN-09
- id: VEN-06
  nombre: Crecimiento de ventas (nominal y real)
  pregunta: ¿Crecemos? ¿Y por encima de la inflación?
  definicion: Variación % de venta neta vs período de comparación, nominal y ajustada por índice de precios.
  formula: |
    var_nominal = venta(periodo) / nullif(venta(comp), 0) - 1
    var_real = real_amount(venta(periodo)) / nullif(real_amount(venta(comp)), 0) - 1
    -- comp: mes_anterior | mismo_periodo_anio_anterior | mismo_periodo_a_la_fecha (MTD vs MTD con igual cantidad de días hábiles)
  cube: ventas.venta_neta con comparación (time dimension compareDateRange)
  unidad: porcentaje
  direccion: mayor_mejor
  agregacion: calculado
  grano_min: dia
  dimensiones:
  - canal
  - sucursal
  - categoria
  - vendedor
  filtros_base:
  - pedido_valido
  parametros:
    comparacion: mes_anterior|anio_anterior|mtd
    ajuste: real por defecto
  requisitos:
    obligatorias:
    - fct_pedido.fecha_pedido
    - fct_pedido.importe_neto
    opcionales:
    - ref.indice_precios.indice
    - ref.feriado.fecha
  roles_minimos:
  - ventas
  historia_minima: ≥ 13 meses de historia para interanual
  casos_borde:
  - Comparación MTD debe igualar días hábiles transcurridos (ref.fecha.es_habil), no días calendario.
  - En contextos inflacionarios el agente debe reportar SIEMPRE la variación real junto a la nominal.
  alertas:
  - condicion: var_real interanual < -5%
    severidad: alta
  relacionados:
  - VEN-01
  - FIN-22
- id: VEN-07
  nombre: Cumplimiento de presupuesto / cuota
  pregunta: ¿Qué porcentaje del objetivo llevamos?
  definicion: Venta neta real / presupuesto (o cuota) del período; también % esperado a la fecha según días hábiles transcurridos.
  formula: |
    cumplimiento = venta_neta / nullif(ppto, 0)
    esperado_a_la_fecha = dias_habiles_transcurridos / dias_habiles_mes
    ritmo = cumplimiento / nullif(esperado_a_la_fecha, 0)
  cube: presupuesto.cumplimiento_ventas
  unidad: porcentaje
  direccion: mayor_mejor
  agregacion: ratio
  grano_min: mes
  dimensiones:
  - canal
  - sucursal
  - vendedor
  - categoria
  filtros_base:
  - presupuesto concepto in (venta_neta, cuota_vendedor)
  parametros:
    version: original
  requisitos:
    obligatorias:
    - fct_pedido.fecha_pedido
    - fct_pedido.importe_neto
    - fct_presupuesto.importe
    opcionales:
    - fct_pedido.vendedor_id
    - fct_pedido.canal_id
    - ref.feriado.fecha
  roles_minimos:
  - presupuesto
  - ventas
  casos_borde:
  - Presupuesto anual sin apertura mensual → se distribuye por estacionalidad del año anterior (marcar).
  alertas:
  - condicion: ritmo < 0.9 después del día hábil 10
    severidad: alta
  relacionados:
  - FIN-19
  - VEN-24
- id: VEN-08
  nombre: Margen bruto comercial por producto/categoría
  pregunta: ¿Qué productos y categorías nos dejan más margen?
  definicion: Venta neta de líneas − costo de líneas; margen % = margen / venta.
  formula: |
    select pr.categoria_n1, sum(l.importe_neto) venta, sum(l.costo_total) costo,
           sum(l.importe_neto - l.costo_total) margen, sum(l.importe_neto - l.costo_total)/nullif(sum(l.importe_neto),0) margen_pct
    from core.fct_pedido_linea l join core.fct_pedido p using (pedido_id) join core.dim_producto pr using (producto_id)
    where pedido_valido and p.fecha_pedido between :desde and :hasta group by 1;
  cube: ventas.margen_bruto, ventas.margen_bruto_pct
  unidad: moneda | porcentaje
  direccion: mayor_mejor
  agregacion: aditivo / ratio
  grano_min: dia
  dimensiones:
  - producto
  - categoria
  - marca
  - canal
  - sucursal
  - vendedor
  - cliente
  filtros_base:
  - pedido_valido
  - costo_total not null
  parametros:
    costo: historico|reposicion
  requisitos:
    obligatorias:
    - fct_pedido_linea.producto_id
    - fct_pedido_linea.importe_neto
    - fct_pedido_linea.costo_unitario
    - fct_pedido_linea.costo_total
    opcionales:
    - dim_producto.categoria_n1
    - dim_producto.categoria_n2
    - dim_producto.categoria_n3
  roles_minimos:
  - ventas
  casos_borde:
  - Informa `pct_venta_sin_costo`; si > 5 % el agente lo aclara.
  - costo='reposicion' usa dim_producto.costo_estandar actual (mejor para decisiones de precio en inflación).
  alertas:
  - condicion: producto con margen_pct < 0 y ventas > 0
    severidad: alta
  - condicion: categoría baja > 5 pp de margen vs mes anterior
    severidad: media
  relacionados:
  - FIN-03
  - VEN-09
  - INV-11
- id: VEN-09
  nombre: Margen de contribución por canal
  pregunta: ¿Qué canal es realmente rentable después de comisiones, envío y financiación?
  definicion: Venta neta − CMV − comisión del canal − costo de financiación − costo de envío a cargo del vendedor (+ envío cobrado) − comisión de pasarela − inversión
    publicitaria asignada al canal (opcional).
  formula: |
    select p.canal_id,
      sum(p.importe_neto) venta,
      sum(p.importe_neto - p.costo_mercaderia - coalesce(p.comision_canal,0) - coalesce(p.costo_financiacion,0)
          - coalesce(p.costo_envio_vendedor,0) + coalesce(p.importe_envio_cobrado,0) - coalesce(lp.comision,0)) contribucion
    from core.fct_pedido p left join (select pedido_id, sum(comision) comision from core.fct_liquidacion_pasarela group by 1) lp using (pedido_id)
    where pedido_valido and p.fecha_pedido between :desde and :hasta group by 1;
    -- opcional incluir_ads: restar Σ fct_ads_diario.gasto asignado (asignación plataforma → canal de venta configurada por el tenant)
  cube: ventas.contribucion, ventas.contribucion_pct
  unidad: moneda | porcentaje
  direccion: mayor_mejor
  agregacion: aditivo / ratio
  grano_min: dia
  dimensiones:
  - canal
  - categoria
  - producto
  - modalidad
  filtros_base:
  - pedido_valido
  parametros:
    incluir_ads: false
  requisitos:
    obligatorias:
    - fct_pedido.importe_neto
    - fct_pedido.canal_id
    - fct_pedido_linea.costo_total
    opcionales:
    - fct_pedido.comision_canal
    - fct_pedido.costo_financiacion
    - fct_pedido.costo_envio_vendedor
    - fct_pedido.importe_envio_cobrado
    - fct_liquidacion_pasarela.comision
    - fct_ads_diario.gasto
  roles_minimos:
  - ventas
  casos_borde:
  - Si el canal informa comisiones con impuesto incluido, el mapping las guarda netas con sin_impuesto().
  - Envíos bonificados por el canal → costo_envio_vendedor puede ser 0 o negativo.
  alertas:
  - condicion: contribucion_pct de un canal < 10%
    severidad: alta
  - condicion: producto con contribución negativa en marketplace
    severidad: alta
  relacionados:
  - VEN-05
  - FIN-17
  - LOG-12
- id: VEN-10
  nombre: Clientes activos
  pregunta: ¿Cuántos clientes distintos nos compraron?
  definicion: Clientes distintos con ≥1 pedido válido en el período (o en ventana móvil de 12 meses para "base activa").
  formula: select count(distinct cliente_id) from core.fct_pedido where pedido_valido and cliente_id <> '-1' and fecha_pedido between :desde and :hasta;
  cube: clientes.activos
  unidad: cantidad
  direccion: mayor_mejor
  agregacion: no_aditivo (distinct)
  grano_min: dia
  dimensiones:
  - canal
  - tipo_cliente
  - region
  - vendedor
  filtros_base:
  - pedido_valido
  - cliente identificado
  parametros:
    ventana: periodo|12m_movil
  requisitos:
    obligatorias:
    - fct_pedido.fecha_pedido
    - fct_pedido.cliente_id
    opcionales:
    - dim_cliente.tipo_cliente
    - dim_cliente.region
  roles_minimos:
  - ventas
  casos_borde:
  - Consumidores finales sin identificación (mostrador) no cuentan; se informa % de venta anónima.
  - Un mismo comprador en dos canales se unifica solo si coincide documento, email o teléfono (docs/04 §6).
  alertas:
  - condicion: base activa 12m cae > 5% vs trimestre anterior
    severidad: media
  relacionados:
  - VEN-11
  - VEN-12
- id: VEN-11
  nombre: Clientes nuevos y participación de nuevos en la venta
  pregunta: ¿Cuántos clientes nuevos ganamos y cuánto aportan?
  definicion: Clientes cuya primera compra válida cae en el período; % venta de nuevos = venta de pedidos es_primera_compra / venta total.
  formula: |
    select count(distinct cliente_id) filter (where es_primera_compra) nuevos,
           sum(importe_neto) filter (where es_primera_compra) / nullif(sum(importe_neto),0) pct_venta_nuevos
    from core.fct_pedido where pedido_valido and fecha_pedido between :desde and :hasta;
  cube: clientes.nuevos, ventas.pct_venta_nuevos
  unidad: cantidad | porcentaje
  direccion: mayor_mejor
  agregacion: aditivo (nuevos) / ratio
  grano_min: dia
  dimensiones:
  - canal
  - canal_marketing
  - region
  - tipo_cliente
  filtros_base:
  - pedido_valido
  parametros: {}
  requisitos:
    obligatorias:
    - fct_pedido.fecha_pedido
    - fct_pedido.cliente_id
    - fct_pedido.importe_neto
    opcionales:
    - fct_pedido.canal_id
    - fct_atribucion_pedido.canal_marketing
  roles_minimos:
  - ventas
  historia_minima: ≥ 12 meses (antes
  casos_borde:
  - 'La historia cargada define "nuevo": si el tenant trae solo 6 meses, un cliente viejo parece nuevo.'
  alertas:
  - condicion: nuevos cae > 20% vs mes anterior
    severidad: media
  relacionados:
  - MKT-08
- id: VEN-12
  nombre: Tasa de recompra
  pregunta: ¿Qué porcentaje de clientes vuelve a comprar?
  definicion: Clientes con ≥2 pedidos en ventana / clientes con ≥1 pedido en ventana (12 meses móviles por defecto); y cohortes de recompra a 30/60/90/180 días.
  formula: |
    with c as (select cliente_id, count(distinct pedido_id) n from core.fct_pedido
               where pedido_valido and fecha_pedido > :hasta - interval '12 months' and fecha_pedido <= :hasta group by 1)
    select count(*) filter (where n >= 2)::numeric / nullif(count(*),0) from c;
    -- cohortes: marts.ven__cohortes_recompra (cohorte = mes de primera compra, % que recompra en N días)
  cube: clientes.tasa_recompra, cohortes.recompra_n_dias
  unidad: porcentaje
  direccion: mayor_mejor
  agregacion: calculado
  grano_min: mes
  dimensiones:
  - canal (de primera compra)
  - canal_marketing adquisición
  - categoria primera compra
  filtros_base:
  - pedido_valido
  - cliente identificado
  parametros:
    ventana_meses: 12
    dias_cohorte: 30|60|90|180
  requisitos:
    obligatorias:
    - fct_pedido.fecha_pedido
    - fct_pedido.cliente_id
    opcionales: []
  roles_minimos:
  - ventas
  casos_borde:
  - En marketplace el buyer id cambia poco pero no hay email; la recompra cross-canal puede subestimarse.
  alertas:
  - condicion: tasa_recompra 12m cae > 3 pp vs trimestre anterior
    severidad: media
  relacionados:
  - VEN-13
  - VEN-14
  - VEN-15
- id: VEN-13
  nombre: Frecuencia de compra
  pregunta: ¿Cada cuántos días nos compra un cliente?
  definicion: Pedidos / clientes activos en ventana; y mediana de días entre pedidos consecutivos del mismo cliente.
  formula: |
    frecuencia = count(distinct pedido_id) / count(distinct cliente_id)   -- ventana 12m
    dias_entre_compras = percentile_cont(0.5) within group (order by fecha_pedido - lag(fecha_pedido) over (partition by cliente_id order by fecha_pedido))
  cube: clientes.frecuencia, clientes.dias_entre_compras
  unidad: ratio | dias
  direccion: mayor_mejor (frecuencia)
  agregacion: calculado
  grano_min: mes
  dimensiones:
  - tipo_cliente
  - canal
  - vendedor
  filtros_base:
  - pedido_valido
  parametros:
    ventana_meses: 12
  requisitos:
    obligatorias:
    - fct_pedido.fecha_pedido
    - fct_pedido.cliente_id
    opcionales: []
  roles_minimos:
  - ventas
  casos_borde:
  - ''
  alertas: []
  relacionados:
  - VEN-12
  - VEN-15
- id: VEN-14
  nombre: LTV (valor de vida del cliente)
  pregunta: ¿Cuánto margen nos deja un cliente a lo largo del tiempo?
  definicion: Margen bruto acumulado promedio por cliente de una cohorte a 12 meses de su primera compra (LTV histórico); opcional LTV predictivo = ticket × frecuencia
    × margen% × vida esperada.
  formula: |
    -- histórico por cohorte (marts.ven__ltv_cohorte)
    select date_trunc('month', c.fecha_primera_compra) cohorte,
           sum(l.importe_neto - l.costo_total) / count(distinct c.cliente_id) ltv_12m
    from core.dim_cliente c join core.fct_pedido p using (cliente_id) join core.fct_pedido_linea l using (pedido_id)
    where pedido_valido and p.fecha_pedido < c.fecha_primera_compra + interval '12 months' group by 1;
  cube: clientes.ltv_12m
  unidad: moneda
  direccion: mayor_mejor
  agregacion: calculado por cohorte
  grano_min: mes
  dimensiones:
  - cohorte
  - canal_adquisicion
  - canal_marketing
  - tipo_cliente
  filtros_base:
  - cohortes con ≥ 12 meses de antigüedad
  parametros:
    horizonte_meses: 6|12|24
    ajuste: real por defecto
    base: margen|venta
  requisitos:
    obligatorias:
    - fct_pedido.fecha_pedido
    - fct_pedido.cliente_id
    - fct_pedido_linea.importe_neto
    - fct_pedido_linea.costo_total
    opcionales: []
  roles_minimos:
  - ventas
  historia_minima: ≥ 12 meses de historia con clientes identificados
  casos_borde:
  - 'Siempre en términos reales: sumar importes de distintos meses sin ajustar distorsiona.'
  alertas: []
  relacionados:
  - MKT-09
- id: VEN-15
  nombre: Churn de clientes (B2B / recurrentes)
  pregunta: ¿Cuántos clientes dejaron de comprarnos?
  definicion: Clientes activos al inicio del período que no compraron en los últimos N días (N = umbral tenant, default 2× su frecuencia típica o 90 días) / clientes
    activos al inicio.
  formula: |
    en_riesgo = clientes con dias_desde_ultima_compra > 1.5 × su dias_entre_compras mediano
    churn = clientes activos(inicio) sin compra en ventana N / clientes activos(inicio)
  cube: clientes.churn, clientes.en_riesgo
  unidad: porcentaje | cantidad
  direccion: menor_mejor
  agregacion: calculado
  grano_min: mes
  dimensiones:
  - vendedor
  - tipo_cliente
  - region
  filtros_base:
  - tipo_cliente = 'empresa' por defecto
  parametros:
    dias_inactividad: 90
  requisitos:
    obligatorias:
    - fct_pedido.fecha_pedido
    - fct_pedido.cliente_id
    opcionales:
    - dim_cliente.tipo_cliente
    - fct_pedido.vendedor_id
  roles_minimos:
  - ventas
  casos_borde:
  - En B2C de baja frecuencia (compra anual) churn no es significativo; el agente usa VEN-12.
  alertas:
  - condicion: cliente top 20 (por venta 12m) en riesgo
    severidad: alta
  relacionados:
  - VEN-12
  - VEN-23
- id: VEN-16
  nombre: Tasa de devolución
  pregunta: ¿Qué porcentaje de lo vendido nos devuelven y por qué?
  definicion: Unidades (o importe) devueltas / unidades (o importe) vendidas, emparejando por fecha de pedido original (cohorte) o por fecha de devolución (flujo).
  formula: |
    -- por cohorte de pedido (recomendado)
    select sum(l.cantidad_devuelta) / nullif(sum(l.cantidad),0)
    from core.fct_pedido_linea l join core.fct_pedido p using (pedido_id)
    where pedido_valido and p.fecha_pedido between :desde and :hasta;
  cube: devoluciones.tasa_unidades, devoluciones.tasa_importe
  unidad: porcentaje
  direccion: menor_mejor
  agregacion: ratio
  grano_min: dia
  dimensiones:
  - producto
  - categoria
  - marca
  - canal
  - motivo
  - transportista
  filtros_base:
  - pedido_valido
  parametros:
    base: cohorte|flujo
    medida: unidades|importe
  requisitos:
    obligatorias:
    - fct_devolucion.fecha_recepcion
    - fct_devolucion.cantidad
    - fct_pedido_linea.cantidad
    opcionales:
    - fct_devolucion.importe_neto
    - fct_devolucion.motivo
    - fct_devolucion.pedido_linea_id
  roles_minimos:
  - ventas
  casos_borde:
  - Períodos recientes (< 30 días) están incompletos en base cohorte; marcar "madurando".
  alertas:
  - condicion: producto con tasa > 2× la de su categoría y ≥ 10 unidades vendidas
    severidad: alta
  - condicion: tasa total sube > 2 pp vs promedio 3 meses
    severidad: media
  relacionados:
  - LOG-15
  - LOG-18
- id: VEN-17
  nombre: Tasa de cancelación
  pregunta: ¿Qué porcentaje de pedidos se cancela?
  definicion: Pedidos cancelados (excluye borradores y carritos abandonados) / pedidos creados no borrador.
  formula: |
    select count(*) filter (where estado='cancelado')::numeric / nullif(count(*) filter (where estado <> 'borrador'),0)
    from core.fct_pedido where es_fuente_verdad and fecha_pedido between :desde and :hasta;
  cube: ventas.tasa_cancelacion
  unidad: porcentaje
  direccion: menor_mejor
  agregacion: ratio
  grano_min: dia
  dimensiones:
  - canal
  - medio_pago
  - motivo (si disponible)
  - deposito
  filtros_base:
  - es_fuente_verdad
  parametros: {}
  requisitos:
    obligatorias:
    - fct_pedido.estado
    - fct_pedido.estado_pago
    opcionales:
    - fct_pedido.canal_id
    - fct_pedido.medio_pago
  roles_minimos:
  - ventas
  casos_borde:
  - marketplace cancela por falta de stock y penaliza reputación → cruzar con INV-06.
  alertas:
  - condicion: tasa_cancelacion marketplace > 2%
    severidad: alta
  relacionados:
  - INV-06
  - LOG-14
- id: VEN-18
  nombre: Descuento promedio
  pregunta: ¿Cuánto estamos descontando sobre precio de lista?
  definicion: Importe de descuentos / importe bruto (precio lista).
  formula: select sum(importe_descuento)/nullif(sum(importe_bruto),0) from core.fct_pedido where pedido_valido and fecha_pedido between :desde and :hasta;
  cube: ventas.descuento_pct
  unidad: porcentaje
  direccion: menor_mejor
  agregacion: ratio
  grano_min: dia
  dimensiones:
  - vendedor
  - canal
  - cupon
  - categoria
  - cliente
  filtros_base:
  - pedido_valido
  parametros: {}
  requisitos:
    obligatorias:
    - fct_pedido.importe_bruto
    - fct_pedido.importe_descuento
    opcionales:
    - fct_pedido.vendedor_id
    - fct_pedido.canal_id
  roles_minimos:
  - ventas
  casos_borde:
  - Precio promocional publicado (tachado) en e-commerce no siempre queda como descuento; depende de la fuente.
  alertas:
  - condicion: vendedor con descuento_pct > 1.5× promedio del equipo
    severidad: media
  relacionados:
  - VEN-08
- id: VEN-19
  nombre: Pipeline abierto y ponderado
  pregunta: ¿Cuánto negocio tenemos en juego en el CRM?
  definicion: Suma de importe de oportunidades abiertas; ponderado = Σ importe × probabilidad.
  formula: |
    select sum(importe) pipeline, sum(importe*probabilidad/100) ponderado, count(*) oportunidades
    from core.fct_oportunidad where not esta_cerrada;
  cube: crm.pipeline_abierto, crm.pipeline_ponderado
  unidad: moneda
  direccion: mayor_mejor
  agregacion: snapshot
  grano_min: dia
  dimensiones:
  - etapa
  - vendedor
  - pipeline
  - mes de cierre esperado
  - origen
  filtros_base:
  - no cerrada
  parametros:
    cierre_esperado_hasta: null
  requisitos:
    obligatorias:
    - fct_oportunidad.etapa
    - fct_oportunidad.importe
    - fct_oportunidad.esta_cerrada
    - fct_oportunidad.fecha_cierre_esperada
    opcionales:
    - fct_oportunidad.probabilidad
    - fct_oportunidad.vendedor_id
  roles_minimos:
  - crm
  casos_borde:
  - Oportunidades con cierre esperado vencido > 30 días se marcan "estancadas" y se muestran aparte.
  alertas:
  - condicion: pipeline ponderado del mes siguiente < 1.0× cuota
    severidad: alta
  - condicion: oportunidades estancadas > 20% del pipeline
    severidad: media
  relacionados:
  - VEN-20
  - VEN-21
  - VEN-22
- id: VEN-20
  nombre: Tasa de cierre (win rate)
  pregunta: ¿Qué porcentaje de oportunidades ganamos?
  definicion: Ganadas / (ganadas + perdidas) cerradas en el período (por cantidad e importe).
  formula: |
    select count(*) filter (where esta_ganada)::numeric / nullif(count(*),0) win_rate_cant,
           sum(importe) filter (where esta_ganada) / nullif(sum(importe),0) win_rate_importe
    from core.fct_oportunidad where esta_cerrada and fecha_cierre between :desde and :hasta;
  cube: crm.win_rate
  unidad: porcentaje
  direccion: mayor_mejor
  agregacion: ratio
  grano_min: mes
  dimensiones:
  - vendedor
  - origen
  - pipeline
  - motivo_perdida
  - rango_importe
  filtros_base:
  - cerrada en período
  parametros: {}
  requisitos:
    obligatorias:
    - fct_oportunidad.esta_ganada
    - fct_oportunidad.esta_cerrada
    - fct_oportunidad.fecha_cierre
    - fct_oportunidad.importe
    opcionales:
    - fct_oportunidad.fecha_cierre_esperada
    - fct_oportunidad.vendedor_id
  roles_minimos:
  - crm
  casos_borde:
  - ''
  alertas:
  - condicion: win_rate cae > 10 pp vs trimestre anterior
    severidad: media
  relacionados:
  - VEN-19
  - MKT-16
- id: VEN-21
  nombre: Ciclo de venta
  pregunta: ¿Cuántos días tarda en cerrarse una venta?
  definicion: Mediana de (fecha_cierre − fecha_creacion) de oportunidades ganadas; tiempo en cada etapa desde el historial.
  formula: |
    select percentile_cont(0.5) within group (order by fecha_cierre - fecha_creacion)
    from core.fct_oportunidad where esta_ganada and fecha_cierre between :desde and :hasta;
  cube: crm.ciclo_venta_dias
  unidad: dias
  direccion: menor_mejor
  agregacion: mediana
  grano_min: mes
  dimensiones:
  - vendedor
  - origen
  - rango_importe
  - etapa (tiempo por etapa)
  filtros_base:
  - ganadas
  parametros: {}
  requisitos:
    obligatorias:
    - fct_oportunidad.fecha_creacion
    - fct_oportunidad.fecha_cierre
    - fct_oportunidad.esta_ganada
    - fct_oportunidad.esta_cerrada
    - fct_oportunidad_historial_etapa.etapa
    - fct_oportunidad_historial_etapa.entrada_at
    opcionales:
    - fct_oportunidad.fecha_cierre_esperada
  roles_minimos:
  - crm
  casos_borde:
  - ''
  alertas: []
  relacionados:
  - VEN-22
- id: VEN-22
  nombre: Velocidad de pipeline
  pregunta: ¿Cuánto dinero por día genera nuestro pipeline?
  definicion: (Oportunidades abiertas × win rate × ticket promedio ganado) / ciclo de venta en días.
  formula: velocidad = (count_abiertas * VEN-20.win_rate_cant * avg_importe_ganado) / nullif(VEN-21.ciclo_dias, 0)
  cube: crm.velocidad_pipeline
  unidad: moneda por día
  direccion: mayor_mejor
  agregacion: calculado
  grano_min: mes
  dimensiones:
  - vendedor
  - pipeline
  filtros_base: []
  parametros:
    ventana_meses: 6
  requisitos:
    obligatorias:
    - fct_oportunidad.importe
    - fct_oportunidad.esta_ganada
    - fct_oportunidad.esta_cerrada
    - fct_oportunidad.fecha_creacion
    - fct_oportunidad.fecha_cierre
    opcionales:
    - fct_oportunidad.fecha_cierre_esperada
  roles_minimos:
  - crm
  historia_minima: ≥ 6 meses
  casos_borde:
  - ''
  alertas: []
  relacionados:
  - VEN-19
  - VEN-20
  - VEN-21
- id: VEN-23
  nombre: Concentración de ventas (Pareto clientes/productos)
  pregunta: ¿Dependemos de pocos clientes o productos?
  definicion: '% de la venta que explica el top 10 / top 20 % de clientes o productos; índice HHI opcional.'
  formula: |
    with r as (select cliente_id, sum(importe_neto) v from core.fct_pedido where pedido_valido and fecha_pedido between :desde and :hasta group by 1)
    select sum(v) filter (where rk <= 10) / sum(v) top10_pct
    from (select *, rank() over (order by v desc) rk from r) x;
  cube: ventas.concentracion
  unidad: porcentaje
  direccion: menor_mejor
  agregacion: calculado
  grano_min: mes
  dimensiones:
  - entidad (cliente|producto|categoria)
  filtros_base:
  - pedido_valido
  parametros:
    entidad: cliente|producto
    top_n: 10
  requisitos:
    obligatorias:
    - fct_pedido.importe_neto
    - fct_pedido_linea.producto_id
    - fct_pedido_linea.importe_neto
    opcionales:
    - fct_pedido.cliente_id
  roles_minimos:
  - ventas
  casos_borde:
  - ''
  alertas:
  - condicion: un solo cliente > 20% de la venta 12m
    severidad: alta
  relacionados:
  - VEN-15
  - INV-12
- id: VEN-24
  nombre: Proyección de cierre de mes
  pregunta: ¿Cuánto vamos a vender a fin de mes al ritmo actual?
  definicion: Venta MTD + venta diaria esperada × días hábiles restantes, con estacionalidad por día de semana de las últimas 8 semanas y ajuste por pipeline/pedidos
    pendientes en B2B.
  formula: |
    proyeccion = venta_mtd + Σ_{d en dias restantes} promedio_venta(dia_semana(d), ultimas 8 semanas, excluyendo feriados) × factor_tendencia
    factor_tendencia = venta_mtd / venta_esperada_mtd_segun_mismo_modelo (acotado 0.7–1.3)
  cube: ventas.proyeccion_mes (mart marts.ven__proyeccion_mes, recalculado diario)
  unidad: moneda
  direccion: mayor_mejor
  agregacion: calculado
  grano_min: dia
  dimensiones:
  - canal
  - sucursal
  filtros_base:
  - pedido_valido
  parametros: {}
  requisitos:
    obligatorias:
    - fct_pedido.fecha_pedido
    - fct_pedido.importe_neto
    opcionales:
    - fct_pedido.canal_id
    - ref.feriado.fecha
  roles_minimos:
  - ventas
  historia_minima: ≥ 8 semanas de historia
  casos_borde:
  - Eventos especiales (eventos promocionales masivos) se marcan en ref.fecha como evento para no contaminar la base.
  alertas:
  - condicion: proyeccion < 90% presupuesto
    severidad: alta
  relacionados:
  - VEN-07
  - FIN-20
- id: VEN-25
  nombre: Productividad por vendedor
  pregunta: ¿Cómo rinde cada vendedor?
  definicion: Venta neta, pedidos, ticket, margen %, descuento %, clientes activos y cumplimiento de cuota por vendedor.
  formula: vista compuesta de VEN-01, VEN-02, VEN-03, VEN-08, VEN-18, VEN-10, VEN-07 con dimensión vendedor
  cube: view vendedores_scorecard
  unidad: varias
  direccion: mayor_mejor
  agregacion: vista
  grano_min: mes
  dimensiones:
  - vendedor
  - equipo
  - sucursal
  filtros_base:
  - pedido_valido
  - vendedor_id <> '-1'
  parametros: {}
  requisitos:
    obligatorias:
    - fct_pedido.vendedor_id
    - fct_pedido.importe_neto
    opcionales:
    - fct_pedido.importe_descuento
    - fct_presupuesto.importe
    - fct_pedido_linea.costo_total
  roles_minimos:
  - ventas
  casos_borde:
  - Ventas online sin vendedor quedan en "Sin asignar" y se excluyen del ranking.
  alertas:
  - condicion: vendedor con ritmo de cuota < 0.7 al día hábil 15
    severidad: media
  relacionados:
  - VEN-07
- id: VEN-26
  nombre: Rendimiento de promociones (ROI)
  pregunta: ¿Las promociones nos hacen ganar o perder plata?
  definicion: Margen incremental neto de las promociones (con canibalización y efecto posterior) sobre su costo (descuento otorgado + comunicación − aporte del proveedor); % de promociones que rindieron.
  formula: |
    select sum(margen_incremental_neto) margen_incremental, sum(margen_incremental_neto) / nullif(sum(costo_promocion),0) roi,
           avg((roi >= :roi_minimo)::int) pct_rindieron
    from marts.act__promociones where fecha_fin between :desde and :hasta;
  cube: promociones.roi, promociones.margen_incremental
  unidad: ratio | moneda | porcentaje
  direccion: mayor_mejor
  agregacion: calculado
  grano_min: mes
  dimensiones: [mecanica, objetivo, categoria, canal, sucursal]
  filtros_base: [promociones finalizadas hace ≥ 14 días para incluir efecto posterior]
  parametros: {roi_minimo: 0}
  requisitos:
    obligatorias: [dim_promocion.fecha_inicio, dim_promocion.fecha_fin, fct_promocion_producto.producto_id, fct_pedido_linea.cantidad, fct_pedido_linea.importe_neto, fct_pedido_linea.costo_total]
    opcionales: [fct_pedido_linea.promocion_id, dim_promocion.aporte_proveedor_monto, dim_promocion.costo_comunicacion]
  casos_borde:
  - Promociones superpuestas sobre el mismo producto se evalúan en conjunto y se informa la superposición.
  alertas:
  - {condicion: "margen incremental neto del mes < 0", severidad: alta}
  relacionados: [VEN-08, VEN-18]
- id: VEN-27
  nombre: Productos con margen bajo el mínimo
  pregunta: ¿Cuántos productos estamos vendiendo por debajo del margen que definimos (o del costo)?
  definicion: Productos activos cuyo margen con costo de reposición vigente está por debajo del margen mínimo de su política de precio; ponderado por venta.
  formula: |
    select count(*) filter (where margen_actual < margen_minimo) productos_bajo_minimo,
           count(*) filter (where precio_actual < costo_nuevo) productos_bajo_costo,
           sum(venta_30d) filter (where margen_actual < margen_minimo) / nullif(sum(venta_30d),0) pct_venta_bajo_minimo
    from marts.act__remarcacion where fecha = :fecha;
  cube: precios.productos_bajo_margen
  unidad: cantidad | porcentaje
  direccion: menor_mejor
  agregacion: snapshot
  grano_min: dia
  dimensiones: [categoria, proveedor, marca, lista_precios, sucursal]
  filtros_base: [sin precio promocional vigente]
  parametros: {}
  requisitos:
    obligatorias: [fct_precio_venta.precio, fct_precio_venta.vigente_desde]
    alternativas:
    - nombre: costo_lista_proveedor
      obligatorias: [fct_lista_precio_proveedor.costo_neto]
    - nombre: costo_estandar
      obligatorias: [dim_producto.costo_estandar]
  casos_borde:
  - Requiere política de precio cargada (ops.politica_precio); sin política se usa el margen promedio de la categoría de los últimos 90 días como referencia.
  alertas:
  - {condicion: "productos_bajo_costo > 0", severidad: critica}
  - {condicion: "pct_venta_bajo_minimo > 10%", severidad: alta}
  relacionados: [FIN-03, VEN-08]
