[base]
tipo = odbc
cadena = DRIVER={Firebird/InterBase(r) driver};DBNAME=localhost:C:\Sistema\DATOS.FDB;UID=SYSDBA;PWD=%FIREBIRD_CLAVE%;READONLY=1

[consulta:ventas]
tipo = ventas
incremental = fecha
sql = SELECT FECHA AS fecha, SUCURSAL AS sucursal, NUMERO AS ticket, ARTICULO AS producto, CANTIDAD AS cantidad, PRECIO AS precio
      FROM VENTAS_DETALLE WHERE FECHA > :desde
