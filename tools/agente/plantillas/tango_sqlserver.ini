; Tango Gestión (Axoft) sobre SQL Server. Revisá los nombres con tu versión: GVA12 = comprobantes de venta, GVA53 = renglones,
; STA11 = artículos, STA19 = saldos de stock. Usá un usuario de SQL Server con permiso SOLO de lectura.
[base]
tipo = odbc
cadena = DRIVER={ODBC Driver 17 for SQL Server};SERVER=SERVIDOR\AXSQLEXPRESS;DATABASE=MI_EMPRESA;UID=lectura;PWD=%TANGO_CLAVE%;ApplicationIntent=ReadOnly

[consulta:ventas]
tipo = ventas
incremental = fecha
sql = SELECT CONVERT(date, c.FECHA_EMIS) AS fecha, c.COD_SUCURS AS sucursal, c.T_COMP + ' ' + c.N_COMP AS ticket,
             r.COD_ARTICU AS producto, r.CANTIDAD AS cantidad, r.PRECIO_NET AS precio
      FROM GVA12 c WITH (NOLOCK) JOIN GVA53 r WITH (NOLOCK) ON r.T_COMP = c.T_COMP AND r.N_COMP = c.N_COMP
      WHERE c.FECHA_EMIS > :desde

[consulta:stock]
tipo = stock
cada_minutos = 60
sql = SELECT s.COD_ARTICU AS producto, s.COD_DEPOSI AS sucursal, s.CANT_STOCK AS cantidad FROM STA19 s WITH (NOLOCK)

[consulta:productos]
tipo = productos
cada_minutos = 1440
sql = SELECT a.COD_ARTICU AS codigo, a.DESCRIPCIO AS nombre, a.COD_BARRA AS ean FROM STA11 a WITH (NOLOCK)
