[base]
tipo = odbc
cadena = DRIVER={Microsoft Access Driver (*.mdb, *.accdb)};DBQ=C:\Sistema\Datos.mdb;ReadOnly=1

[consulta:ventas]
tipo = ventas
incremental = fecha
sql = SELECT Fecha AS fecha, Local AS sucursal, NroTicket AS ticket, CodArticulo AS producto, Cantidad AS cantidad, Precio AS precio
      FROM Ventas WHERE Fecha > :desde
