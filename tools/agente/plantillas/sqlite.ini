[base]
tipo = sqlite
ruta = C:\SistemaCaja\datos\caja.sqlite

[consulta:ventas]
tipo = ventas
incremental = fecha
sql = SELECT v.fecha, v.hora, v.local AS sucursal, v.numero AS ticket, v.codigo AS producto, v.cantidad, v.precio
      FROM ventas v WHERE v.fecha > :desde ORDER BY v.fecha

[consulta:stock]
tipo = stock
cada_minutos = 60
sql = SELECT codigo AS producto, local AS sucursal, cantidad FROM existencias

[consulta:productos]
tipo = productos
cada_minutos = 1440
sql = SELECT codigo, descripcion AS nombre, barras AS ean, rubro AS categoria, costo, precio FROM articulos
