; dBase / FoxPro / Clipper: cada archivo .dbf de la carpeta es una tabla. En lugar de SQL se indica tabla, columnas (con alias) e incremental.
[base]
tipo = dbf
carpeta = C:\SISTEMA\DATOS
codificacion = cp1252

[consulta:ventas]
tipo = ventas
tabla = VENTAS
columnas = FECHA as fecha, HORA as hora, SUCURSAL as sucursal, NROTICKET as ticket, CODART as producto, CANTIDAD as cantidad, PRECIO as precio
incremental = FECHA

[consulta:stock]
tipo = stock
cada_minutos = 60
tabla = STOCK
columnas = CODART as producto, SUCURSAL as sucursal, EXISTENCIA as cantidad
