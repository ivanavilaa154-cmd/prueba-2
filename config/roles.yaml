# Permisos por rol.
# - tablas: tablas que el rol puede consultar.
# - filtros_fila: condición SQL que se aplica a cada tabla antes de consultarla.
#   {vendedor_id} se reemplaza por el del usuario. El conector cambia cada tabla
#   por una subconsulta ya filtrada, así el filtro no depende del modelo.
#   Los nombres de tablas y campos son los del ERP (cambian con el diccionario).
roles:
  dueno:
    descripcion: Dueño o gerente general. Ve todo.
    tablas: "*"
  gerente_comercial:
    descripcion: Ventas, clientes, precios, márgenes, stock y deuda de clientes.
    tablas: [sucursales, vendedores, objetivos_vendedores, visitas, clientes, productos, stock, ventas, ventas_lineas,
             devoluciones, pedidos, pedidos_lineas, presupuestos, listas_precios, precios, promociones, cxc, cobranzas]
  vendedor:
    descripcion: Solo su cartera de clientes, pedidos, deuda y oportunidades.
    tablas: [clientes, productos, stock, ventas, ventas_lineas, devoluciones, pedidos, pedidos_lineas, presupuestos,
             visitas, objetivos_vendedores, listas_precios, precios, promociones, cxc, cobranzas]
    filtros_fila:
      clientes: "vendedor_id = {vendedor_id}"
      ventas: "cliente_id IN (SELECT id FROM clientes WHERE vendedor_id = {vendedor_id})"
      ventas_lineas: >-
        venta_id IN (SELECT v.id FROM ventas v JOIN clientes c ON c.id = v.cliente_id
        WHERE c.vendedor_id = {vendedor_id})
      devoluciones: "cliente_id IN (SELECT id FROM clientes WHERE vendedor_id = {vendedor_id})"
      pedidos: "cliente_id IN (SELECT id FROM clientes WHERE vendedor_id = {vendedor_id})"
      pedidos_lineas: >-
        pedido_id IN (SELECT p.id FROM pedidos p JOIN clientes c ON c.id = p.cliente_id
        WHERE c.vendedor_id = {vendedor_id})
      presupuestos: "cliente_id IN (SELECT id FROM clientes WHERE vendedor_id = {vendedor_id})"
      visitas: "vendedor_id = {vendedor_id}"
      objetivos_vendedores: "vendedor_id = {vendedor_id}"
      cxc: "cliente_id IN (SELECT id FROM clientes WHERE vendedor_id = {vendedor_id})"
      cobranzas: "cliente_id IN (SELECT id FROM clientes WHERE vendedor_id = {vendedor_id})"
  compras:
    descripcion: Inventario, proveedores, costos, compras y pedidos sugeridos.
    tablas: [sucursales, productos, componentes_kit, stock, movimientos_stock, proveedores, compras, compras_lineas,
             costos_historial, conteos, ventas, ventas_lineas, devoluciones, promociones]
  administracion:
    descripcion: Cuentas por cobrar y pagar, caja, bancos, gastos e impuestos.
    tablas: [sucursales, clientes, proveedores, ventas, cxc, cobranzas, cheques, cxp, pagos, cuentas_bancarias,
             movimientos_bancarios, gastos, impuestos, prestamos, tipos_cambio, presupuesto]

# Usuarios de demostración.
usuarios:
