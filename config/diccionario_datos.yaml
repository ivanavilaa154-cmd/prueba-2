relaciones:
  - ventas.cliente_id = clientes.id
  - ventas.vendedor_id = vendedores.id
  - ventas.sucursal_id = sucursales.id
  - ventas_lineas.venta_id = ventas.id
  - ventas_lineas.producto_id = productos.id
  - clientes.vendedor_id = vendedores.id
  - clientes.lista_precios_id = listas_precios.id
  - devoluciones.venta_id = ventas.id
  - pedidos_lineas.pedido_id = pedidos.id
  - presupuestos.venta_id = ventas.id
  - precios.lista_precios_id = listas_precios.id
  - productos.proveedor_id = proveedores.id
  - stock.producto_id = productos.id
  - stock.sucursal_id = sucursales.id
  - movimientos_stock.producto_id = productos.id
  - compras.proveedor_id = proveedores.id
  - compras_lineas.compra_id = compras.id
  - cxc.cliente_id = clientes.id
  - cobranzas.cxc_id = cxc.id
  - cxp.proveedor_id = proveedores.id
  - pagos.cxp_id = cxp.id
  - movimientos_bancarios.cuenta_id = cuentas_bancarias.id

definiciones:
  venta_neta: SUM(ventas_lineas.cantidad * ventas_lineas.precio_unitario) excluyendo ventas.anulada = 1 (sin impuestos)
  venta_con_impuestos: venta_neta + SUM(ventas_lineas.impuestos)
  margen_bruto: venta_neta - SUM(cantidad * costo_unitario)
  margen_porcentaje: margen_bruto / venta_neta
  deuda_vencida: SUM(cxc.saldo) donde fecha_vencimiento < hoy y saldo > 0
  dias_reales_cobro: promedio de (fecha_cobro - fecha_emision) en facturas cobradas
  atraso_promedio: promedio de (fecha_cobro - fecha_vencimiento) en facturas cobradas
  deuda_proveedores: SUM(cxp.saldo)
  dpo: deuda_proveedores / (compras facturadas de los últimos 90 días / 90)
  caja_disponible: SUM(cuentas_bancarias.saldo)
  merma: SUM(-movimientos_stock.cantidad * costo_unitario) donde tipo en (merma, vencimiento)
  cumplimiento_proveedor: porcentaje de líneas de compra recibidas completas y en fecha

sinonimos:
  "lo que me deben": deuda de clientes (cxc.saldo)
  "la calle": deuda de clientes (cxc.saldo)
  "cuenta corriente": cxc
  "facturación": venta_neta
  "lo que debo": deuda con proveedores (cxp.saldo)
  "la caja": cuentas_bancarias
  "equipo de ventas": ventas.canal

filtros_por_defecto:
  - Excluir ventas con anulada = 1.

frescura:
  todo: la última sincronización o importación (ver Integraciones)
