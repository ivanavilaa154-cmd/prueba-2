# Diccionario de datos: el modelo estándar de la plataforma (backend/app/erp/modelo.py).
# Cada integración (Odoo, archivos, base del ERP) traduce sus datos a estas tablas.
# Todo campo puede venir vacío si el sistema de origen no lo tiene: en ese caso, decir que falta el dato.
# Importes en la moneda de la fila (vacía = moneda de la empresa). Fechas AAAA-MM-DD. Sí/no = 1/0.

